name: check

on:
  push:
  pull_request:
  # Apollo updates some inputs by itself, so it runs a lock file that no push
  # was checked with. These runs check main with the inputs updated in the
  # same way, about two hours before each of Apollo’s upgrades. Nothing is
  # written back: a failure only mails.
  schedule:
    - cron: "17 2,8,14,20 * * *"

permissions:
  contents: read

# A newer push to the same branch supersedes a running check, and a newer
# scheduled run an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    # Branches of this repository are already checked on push. Pull requests
    # only need their own run when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM for NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            system-features = nixos-test benchmark big-parallel kvm

      # Forks get no token and only download from the cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: mkoppmann-apollo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update the inputs that Apollo updates
        if: github.event_name == 'schedule'
        run: nix flake update $(jq -r '.[]' modules/system/updated-inputs.json)

      - name: Scan history for secrets
        run: nix run --inputs-from . nixpkgs#gitleaks -- git --redact --verbose .

      # The full-system test runs in its own job, at the same time.
      - name: Build system and run checks
        run: |
          nix flake check --no-build --no-update-lock-file
          checks=$(nix eval --raw --no-update-lock-file .#checks.x86_64-linux --apply '
            checks: toString (map (name: ".#checks.x86_64-linux.${name}") (
              builtins.filter (name: name != "apollo") (builtins.attrNames checks)
            ))')
          nix build --print-build-logs --no-link --no-update-lock-file $checks

  full-system:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM for NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            system-features = nixos-test benchmark big-parallel kvm

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: mkoppmann-apollo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update the inputs that Apollo updates
        if: github.event_name == 'schedule'
        run: nix flake update $(jq -r '.[]' modules/system/updated-inputs.json)

      - name: Boot the complete configuration
        run: nix build --print-build-logs --no-link --no-update-lock-file .#checks.x86_64-linux.apollo
