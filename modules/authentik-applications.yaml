# Applications, their OAuth2 providers and access groups, and the admin gate.
# Authentik applies this blueprint at startup and whenever it changes,
# overwriting edits made to these objects in the admin interface. Group
# membership stays in the database.
version: 1
metadata:
  name: Apollo applications

context:
  provider: &provider
    client_type: confidential
    grant_types:
      - authorization_code
      - refresh_token
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    access_code_validity: minutes=1
    access_token_validity: minutes=5
    refresh_token_validity: days=30
    include_claims_in_id_token: true
    issuer_mode: per_provider
    logout_method: backchannel

entries:
  - model: authentik_core.group
    id: actual-budget-access
    identifiers:
      name: actual-budget-access
  - model: authentik_core.group
    id: immich-access
    identifiers:
      name: immich-access
  - model: authentik_core.group
    id: matrix-access
    identifiers:
      name: matrix-access
  - model: authentik_core.group
    id: nextcloud-access
    identifiers:
      name: nextcloud-access

  - model: authentik_providers_oauth2.scopemapping
    id: nextcloud-profile
    identifiers:
      name: Nextcloud Profile
    attrs:
      scope_name: profile
      expression: |
        groups = [group.name for group in user.ak_groups.all()]
        # Nextcloud grants admin rights to its "admin" group.
        if user.is_superuser and "admin" not in groups:
            groups.append("admin")
        return {
            "name": request.user.name,
            "groups": groups,
            "quota": user.group_attributes().get("nextcloud_quota", "10 GB"),
            # Links an existing Nextcloud account to this user.
            "user_id": user.attributes.get("nextcloud_user_id", str(user.uuid)),
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: actual-budget-provider
    identifiers:
      name: Provider for Actual Budget
    attrs:
      <<: *provider
      client_id: 6Q2OZAPVXR23GFP2Nun4ThngMEyDXx8ViBPNQe2p
      client_secret: !Env ACTUAL_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://budget.ncrypt.at/openid/callback
      refresh_token_threshold: hours=1
      sub_mode: hashed_user_id
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    identifiers:
      name: Provider for Immich
    attrs:
      <<: *provider
      client_id: gktHFzXtDhRBALi5MzwRCk5krCzEpF7fKB36H1C2
      client_secret: !Env IMMICH_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: app.immich:///oauth-callback
        - matching_mode: strict
          url: https://photos.mkoppmann.at/auth/login
        - matching_mode: strict
          url: https://photos.mkoppmann.at/user-settings
      refresh_token_threshold: seconds=0
      sub_mode: hashed_user_id
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, idp.ncrypt.at]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_providers_oauth2.oauth2provider
    id: matrix-provider
    identifiers:
      name: Provider for Matrix
    attrs:
      <<: *provider
      client_id: twPr3ojwR4YML11WSd5Ur5lV3H9SqiJXQLuUEXFQ
      client_secret: !Env MATRIX_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://auth.matrix.ncrypt.at/upstream/callback/01KHPE6SE3SVE65KJY6RHN4G7J
      logout_uri: https://auth.matrix.ncrypt.at/upstream/backchannel-logout/01KHPE6SE3SVE65KJY6RHN4G7J
      refresh_token_threshold: seconds=0
      sub_mode: hashed_user_id
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_providers_oauth2.oauth2provider
    id: nextcloud-provider
    identifiers:
      name: Provider for Nextcloud
    attrs:
      <<: *provider
      client_id: s20Aqu1UTDPWkhJqNhWcVtmFLXFiyGtWBmIG6Nf8
      client_secret: !Env NEXTCLOUD_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://cloud.ncrypt.at/apps/user_oidc/code
      refresh_token_threshold: seconds=0
      # Nextcloud links accounts by username; changing this breaks them.
      sub_mode: user_username
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, idp.ncrypt.at]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf nextcloud-profile

  - model: authentik_core.application
    id: actual-budget
    identifiers:
      slug: actual-budget
    attrs:
      name: Actual Budget
      provider: !KeyOf actual-budget-provider
      meta_launch_url: https://budget.ncrypt.at/
      open_in_new_tab: false
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf actual-budget
    attrs:
      group: !KeyOf actual-budget-access

  - model: authentik_core.application
    id: immich
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      meta_launch_url: https://photos.mkoppmann.at
      open_in_new_tab: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf immich
    attrs:
      group: !KeyOf immich-access

  - model: authentik_core.application
    id: matrix
    identifiers:
      slug: matrix
    attrs:
      name: Matrix
      provider: !KeyOf matrix-provider
      meta_launch_url: https://chat.ncrypt.at
      open_in_new_tab: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf matrix
    attrs:
      group: !KeyOf matrix-access

  - model: authentik_core.application
    id: nextcloud
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      provider: !KeyOf nextcloud-provider
      meta_launch_url: https://cloud.ncrypt.at
      open_in_new_tab: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf nextcloud
    attrs:
      group: !KeyOf nextcloud-access

  # Admin gate: superusers only sign in from WireGuard addresses. The deny
  # stage comes after password and MFA, so it reveals nothing to anyone without
  # them. Emergency access: `ak create_recovery_key 1 USERNAME` on Apollo.
  - model: authentik_policies_expression.expressionpolicy
    id: superuser-outside-wireguard
    identifiers:
      name: Superuser outside WireGuard
    attrs:
      expression: |
        user = request.context.get("pending_user")
        return bool(user and user.is_superuser) and ak_client_ip not in ip_network("10.100.0.0/24")
  - model: authentik_stages_deny.denystage
    id: deny-superuser-outside-wireguard
    identifiers:
      name: Deny superusers outside WireGuard
    attrs:
      deny_message: Administrators sign in through WireGuard.

  - model: authentik_flows.flowstagebinding
    id: authentication-admin-gate
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf deny-superuser-outside-wireguard
    attrs:
      # After MFA (30), before the login (100).
      order: 90
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf authentication-admin-gate
    attrs:
      policy: !KeyOf superuser-outside-wireguard

  - model: authentik_flows.flowstagebinding
    id: recovery-admin-gate
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      stage: !KeyOf deny-superuser-outside-wireguard
    attrs:
      # After the email link (20), before the new password is set (30).
      order: 25
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf recovery-admin-gate
    attrs:
      policy: !KeyOf superuser-outside-wireguard

  # Admin sessions end as soon as their IP address changes, so a stolen admin
  # session cookie is useless elsewhere. Admins sign in from a fixed WireGuard
  # address anyway. Without ASN data, which private addresses never have, this
  # binding means: same IP or log out.
  - model: authentik_policies_expression.expressionpolicy
    id: superuser
    identifiers:
      name: Pending user is superuser
    attrs:
      expression: |
        user = request.context.get("pending_user")
        return bool(user and user.is_superuser)
  - model: authentik_stages_user_login.userloginstage
    id: ip-bound-login
    identifiers:
      name: Login bound to the client IP
    attrs:
      network_binding: bind_asn_network_ip
      geoip_binding: no_binding

  # The flows' regular logins (100), referenced by id because policy bindings
  # need the binding's policy target, which only !KeyOf returns. Policies must
  # see the identified user, so they are evaluated when the stage is reached.
  - model: authentik_flows.flowstagebinding
    id: authentication-login
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 100
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    id: recovery-login
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      order: 100
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    id: authentication-ip-bound-login
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf ip-bound-login
    attrs:
      order: 99
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf authentication-ip-bound-login
    attrs:
      policy: !KeyOf superuser
  # The regular login only for everyone else; a second login would replace
  # the binding.
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf authentication-login
    attrs:
      policy: !KeyOf superuser
      negate: true

  - model: authentik_flows.flowstagebinding
    id: recovery-ip-bound-login
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      stage: !KeyOf ip-bound-login
    attrs:
      order: 99
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf recovery-ip-bound-login
    attrs:
      policy: !KeyOf superuser
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf recovery-login
    attrs:
      policy: !KeyOf superuser
      negate: true
